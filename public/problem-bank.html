<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그린섬 · 문제은행</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#26313b;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif}
.top{height:68px;background:#fff;border-bottom:1px solid #dce2e8;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-weight:900}.brand b{color:#c72525}.back{border:1px solid #d6dde5;background:#fff;padding:9px 13px;border-radius:10px;font-weight:800;cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:24px 20px 50px}.hero,.box,.school{background:#fff;border:1px solid #dce2e8;border-radius:18px}.hero{padding:24px;margin-bottom:16px}.hero h1{margin:5px 0 8px;font-size:29px}.eyebrow,.muted{color:#7d8791;font-size:13px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.04em}.box,.school{padding:18px;margin-bottom:16px}
.selects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.select{width:100%;padding:12px;border:1px solid #d8dee5;border-radius:11px;background:#fff;font:inherit}.hint{font-size:12px;color:#8a939c;margin:8px 0 0}.schoolhead,.galleryhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.scroll{overflow:auto;margin-top:13px;border:1px solid #dce2e8;border-radius:13px}.table{border-collapse:collapse;width:100%;min-width:max-content}.table th,.table td{border-bottom:1px solid #e4e8ec;border-right:1px solid #e4e8ec;padding:10px 8px;text-align:center;vertical-align:middle}.table th{background:#f6f8fa;font-size:12px;line-height:1.35;min-width:150px}.table th:first-child,.table td:first-child{position:sticky;left:0;background:#f6f8fa;z-index:2;min-width:94px;font-weight:900}.status{width:126px;padding:9px 6px;border:1px solid #d8dee5;border-radius:9px;background:#fff;font:inherit;font-weight:800}.s-rough,.s-detail{background:#f1f5ff;border-color:#cbd7f4}.s-color{background:#fff6e6;border-color:#f2d29b}.s-done{background:#e9f7ef;border-color:#b8e2c8}.s-edit{background:#fff0f0;border-color:#f0bcbc}
.btn{border:1px solid #d6dde5;background:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#283a4d;color:#fff;border-color:#283a4d}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.photo{border:1px solid #e0e5ea;border-radius:13px;overflow:hidden;background:#f5f7f9}.photo img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.photo .meta{padding:10px}.photo b{display:block;font-size:13px}.photo span{display:block;color:#7d8791;font-size:11px;margin-top:3px}.empty{padding:28px;text-align:center;color:#9199a1;border:1px dashed #d6dde5;border-radius:13px;margin-top:14px}.modal{position:fixed;inset:0;background:#18212b99;display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.modal.open{display:flex}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.preview{max-height:280px;width:100%;object-fit:contain;border-radius:12px;background:#f3f5f7}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.hide{display:none!important}
@media(max-width:700px){.top{padding:0 12px}.wrap{padding:14px 10px 40px}.hero h1{font-size:25px}.selects{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.table th{min-width:135px}.status{width:118px}}@media(max-width:430px){.gallery{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="brand"><b>G</b> 그린섬 학생 페이지 · 문제은행</div><button class="back" id="backHome">← 학생페이지</button></header>
<main class="wrap"><section class="hero"><div class="eyebrow">PROBLEM BANK</div><h1>📚 문제은행</h1><p class="muted">실제 저장소에 등록된 학교와 제시물만 사용합니다.</p></section>
<section class="box"><h2>문제은행 학교 선택</h2><p class="muted">최대 3개 학교까지 선택할 수 있어요. 학교를 선택하면 해당 학교의 실제 제시물이 아래에 표시됩니다.</p><div class="selects" id="selects"></div></section><div id="schools"></div>
<section class="box"><div class="galleryhead"><div><h2>🖼️ 문제은행 그림 사진첩</h2><p class="muted" style="margin:5px 0 0">사진 보관함에서 그림을 추가하고, 내가 쓰는 학교와 제시물을 지정해 저장하세요.</p></div><button class="btn primary" id="addPhoto">📷 사진 보관함에서 선택</button></div><input id="file" type="file" accept="image/*" class="hide"><div id="gallery"></div></section></main>
<div class="modal" id="modal"><div class="modalbox"><h3 style="margin-top:0">문제은행 그림 사진 등록</h3><div class="field"><label>내가 쓰는 학교</label><select id="photoSchool" class="select"></select></div><div class="field" style="margin-top:12px"><label>제시물</label><select id="photoPrompt" class="select"></select></div><img id="preview" class="preview" style="display:none;margin-top:12px"><div class="actions"><button class="btn" id="cancel">취소</button><button class="btn primary" id="savePhoto">사진 저장</button></div></div></div>
<script>
const S={"강원(삼척)":['텀블러&도시락','물안경&스노우보드','스마트워치&이어폰'],"남서울":['트리방울&스프링','볼트너트&깃털','머그컵&책','와인잔&수건','무당벌레&테니스공'],"백석":['단추&국자','다트&손거울','주사위&볼링핀','줄자&와인잔','트라이앵글&병뚜껑'],"상명(천안)":['테니스채&셔틀콕&스펀지','콘센트&돋보기&만년필','다트&탁구채+공&비커','쪼리신발&전구&나무기차','페인트롤러&나무톱&귤','안경&메모지+압정&호두','발레슈즈&톱니&아이스크림','해바라기&달걀껍질&앵무새','벼&동전&선인장','나사못&조개껍질&도토리','파&노트+펜&옥수수알맹이','리본&색종이+클립&아이스크림','식물줄기&라임&벽돌','옷핀&종이&풍선','파티장식 리본&나뭇잎&압정','줄자&연필&금붕어','모종삽&핑킹가위&양배추','와인따개+코르크&콘센트&수박','전화선&공책&브로콜리','판사봉&체리&물이 든 유리컵'],"청주":['토마토&전기콘센트','스테이플러&실타래','선물상자&커터칼','벽돌&허리벨트','콜라&칫솔','금붕어&물안경','셔틀콕&줄자','목장갑&애견리드줄'],"한양(에리카)":['가위&팽이','꼬리빗&오레오쿠키','나사못&종이컵','넥타이&합죽선','스페너&빨래집게','스프링&무선마우스','십자드라이버&무지편지봉투','주름스트로우&티백','철제옷걸이&탁구채','케이블타이&밥주걱','병따개&육각너트','손거울&자물쇠','에어캡&모종삽','달걀박스&병따개','연필깎이&주름스트로우'],"호서":['사과&자물쇠','종이비행기&스카치테이프','테니스공&만년필','라임&분무기','자물쇠&전선']};
const states=['미진행','러프스케치','디테일스케치','채색중','완료','수정필요'];let selected=['','',''],photos=[],pending=null;const key='greensum_problem_bank_schools',photoKey='greensum_problem_bank_photos';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{selected=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(selected)||selected.length!==3)selected=['','',''];photos=JSON.parse(localStorage.getItem(photoKey)||'[]');if(!Array.isArray(photos))photos=[]}catch(e){selected=['','',''];photos=[]}}
function saveSchools(){localStorage.setItem(key,JSON.stringify(selected))}function savePhotos(){localStorage.setItem(photoKey,JSON.stringify(photos))}
function cls(v){return v==='완료'?'s-done':v==='수정필요'?'s-edit':v==='채색중'?'s-color':v==='러프스케치'?'s-rough':v==='디테일스케치'?'s-detail':''}
function render(){const box=document.querySelector('#selects');box.innerHTML='';for(let i=0;i<3;i++){let h='<div class="field"><label>문제은행 학교 선택 '+(i+1)+'</label><select class="select" data-slot="'+i+'"><option value="">학교를 선택해주세요</option>';Object.keys(S).forEach(s=>h+='<option value="'+esc(s)+'" '+(selected[i]===s?'selected':'')+'>'+esc(s)+'</option>');h+='</select></div>';box.insertAdjacentHTML('beforeend',h)}box.querySelectorAll('select').forEach(el=>el.onchange=()=>{selected[+el.dataset.slot]=el.value;saveSchools();renderSchools();renderPhotoSelectors()});renderSchools();renderPhotoSelectors()}
function renderSchools(){const box=document.querySelector('#schools');box.innerHTML='';selected.filter(Boolean).forEach(s=>{let h='<section class="school"><div class="schoolhead"><h2>🏫 '+esc(s)+'</h2><span class="muted">'+S[s].length+'개 제시물</span></div><div class="scroll"><table class="table"><thead><tr><th>진행상황</th>';S[s].forEach(p=>h+='<th>'+esc(p)+'</th>');h+='</tr></thead><tbody><tr><td>진행상황</td>';S[s].forEach(p=>{const k=s+'::'+p,v=localStorage.getItem('greensum_problem_bank_status_'+k)||'미진행';h+='<td><select class="status '+cls(v)+'" data-school="'+esc(s)+'" data-prompt="'+esc(p)+'">'+states.map(x=>'<option '+(x===v?'selected':'')+'>'+x+'</option>').join('')+'</select></td>'});h+='</tr></tbody></table></div><p class="hint">↔ 표를 좌우로 밀어서 모든 제시물을 확인할 수 있어요.</p></section>';box.insertAdjacentHTML('beforeend',h)});box.querySelectorAll('.status').forEach(el=>el.onchange=()=>{localStorage.setItem('greensum_problem_bank_status_'+el.dataset.school+'::'+el.dataset.prompt,el.value);el.className='status '+cls(el.value)})}
function renderPhotoSelectors(){const s=document.querySelector('#photoSchool'),p=document.querySelector('#photoPrompt'),chosen=selected.filter(Boolean);if(!chosen.length){s.innerHTML='<option value="">먼저 위에서 학교를 선택해주세요</option>';p.innerHTML='<option value="">학교를 먼저 선택해주세요</option>';p.disabled=true;return}const current=s.value;s.innerHTML='';chosen.forEach(x=>s.innerHTML+='<option value="'+esc(x)+'">'+esc(x)+'</option>');s.value=chosen.includes(current)?current:chosen[0];p.innerHTML='';(S[s.value]||[]).forEach(x=>p.innerHTML+='<option value="'+esc(x)+'">'+esc(x)+'</option>');p.disabled=!s.value}
function renderGallery(){const g=document.querySelector('#gallery');if(!photos.length){g.innerHTML='<div class="empty">아직 등록한 문제은행 그림이 없습니다.<br>「📷 사진 보관함에서 선택」을 눌러 사진을 추가해보세요.</div>';return}g.innerHTML='<div class="gallery">'+photos.map((p,i)=>'<article class="photo"><img src="'+p.data+'"><div class="meta"><b>'+esc(p.prompt)+'</b><span>'+esc(p.school)+' · '+esc(p.date)+'</span><button class="btn" data-del="'+i+'" style="margin-top:8px">삭제</button></div></article>').join('')+'</div>';g.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.del,1);savePhotos();renderGallery()})}
function openModal(){if(!selected.filter(Boolean).length){alert('먼저 문제은행 학교를 선택해주세요.');return}renderPhotoSelectors();document.querySelector('#modal').classList.add('open')}
function closeModal(){pending=null;document.querySelector('#modal').classList.remove('open');document.querySelector('#preview').style.display='none';document.querySelector('#preview').src=''}
document.querySelector('#addPhoto').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){alert('이미지 파일만 선택할 수 있습니다.');e.target.value='';return}pending=f;const r=new FileReader();r.onload=()=>{document.querySelector('#preview').src=r.result;document.querySelector('#preview').style.display='block';openModal()};r.readAsDataURL(f);e.target.value=''};
document.querySelector('#photoSchool').onchange=renderPhotoSelectors;document.querySelector('#cancel').onclick=closeModal;document.querySelector('#savePhoto').onclick=()=>{if(!pending)return;const school=document.querySelector('#photoSchool').value,prompt=document.querySelector('#photoPrompt').value;if(!school||!prompt){alert('학교와 제시물을 선택해주세요.');return}const reader=new FileReader();reader.onload=()=>{photos.unshift({school,prompt,data:reader.result,date:new Date().toLocaleDateString('ko-KR')});savePhotos();renderGallery();closeModal()};reader.readAsDataURL(pending)};document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function goHome(){const ref=document.referrer;try{const u=ref?new URL(ref,location.href):null;if(u&&u.origin===location.origin&&!u.pathname.endsWith('/problem-bank.html')&&history.length>1){history.back();return}}catch(e){}location.href='/'}document.querySelector('#backHome').onclick=goHome;
load();render();renderGallery();
</script></body></html>
