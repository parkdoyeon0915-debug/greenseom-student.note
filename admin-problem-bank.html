<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제은행 진행상황 · 그린섬</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#26313b;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif}
.bar{height:65px;background:#fff;border-bottom:1px solid #dce2e8;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:900}.brand b{color:#c72525}
.wrap{max-width:1100px;margin:auto;padding:24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}
.top h1{margin:0;font-size:25px}.sub{color:#6f7a85;margin-top:7px}
.btn{border:1px solid #d6dde5;background:#fff;padding:9px 13px;border-radius:9px;font-weight:800;cursor:pointer;text-decoration:none;color:inherit}
.primary{background:#283a4d;color:#fff}
.card{background:#fff;border:1px solid #dce2e8;border-radius:18px;padding:20px;margin-bottom:18px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pill{background:#f1f4f7;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}
.school{border:1px solid #e0e6eb;border-radius:14px;padding:16px;margin-top:14px}
.school-title{font-size:17px;font-weight:900;margin-bottom:12px}
.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.prompt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e1e6eb;border-radius:10px;padding:11px 12px;background:#fafbfc}
.prompt b{font-size:13px;white-space:nowrap}
.done{border-color:#b9dfc7;background:#f1faf4}.edit{border-color:#f0c4c4;background:#fff6f6}.color{border-color:#f0d49d;background:#fffaf0}.rough{border-color:#c8d8ec;background:#f4f8fd}.detail{border-color:#d8c9ec;background:#faf7ff}
.muted{color:#7b8791;padding:14px 0}.error{color:#b42318}.loading{padding:25px 0}
.pb-admin-photos{margin-top:22px;border-top:1px solid #e1e6eb;padding-top:18px}.pb-admin-photos-title{font-size:17px;font-weight:900;margin-bottom:12px}.pb-admin-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.pb-admin-photo{border:1px solid #dce2e8;border-radius:12px;background:#fff;overflow:hidden}.pb-admin-photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#f2f4f6}.pb-admin-photo-meta{padding:9px 10px;font-size:11px;line-height:1.45;color:#5f6b76}.pb-admin-photo-meta b{display:block;color:#26313b;font-size:12px;margin-bottom:2px}.pb-admin-photo-empty{padding:12px;border:1px dashed #dce2e8;border-radius:10px;color:#7b8791;font-size:12px}
@media(max-width:700px){.wrap{padding:12px}.prompts{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:21px}.pb-admin-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="bar"><div class="brand"><b>G</b> 그린섬 관리자</div><a class="btn" href="/admin.html">학생 관리로 돌아가기</a></header>
<main class="wrap">
  <div class="top">
    <div><h1 id="title">문제은행 진행상황</h1><div class="sub" id="sub">불러오는 중...</div></div>
    <a class="btn primary" href="/admin.html">학생 목록</a>
  </div>
  <section class="card"><div id="content" class="loading">진행상황을 불러오는 중...</div></section>
</main>
<script>
(function(){
  const $=s=>document.querySelector(s);
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function cls(v){return v==='완료'?'done':v==='수정필요'?'edit':v==='채색중'?'color':v==='러프스케치'?'rough':v==='디테일스케치'?'detail':'';}
  function photoHtml(photos){
    if(!Array.isArray(photos)||!photos.length)return '<div class="pb-admin-photo-empty">학생이 등록한 사진이 없습니다.</div>';
    return '<div class="pb-admin-photo-grid">'+photos.map((p,i)=>'<div class="pb-admin-photo"><img loading="lazy" src="'+esc(p.data)+'" alt="등록 사진 '+(i+1)+'"><div class="pb-admin-photo-meta"><b>'+esc(p.school||'학교 미지정')+'</b>'+esc(p.prompt||'제시물 미지정')+(p.date?' · '+esc(p.date):'')+'</div></div>').join('')+'</div>';
  }
  const id=Number(new URLSearchParams(location.search).get('id'));
  async function load(){
    try{
      if(!Number.isInteger(id)||id<=0)throw Error('학생 번호가 올바르지 않습니다.');
      const meR=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});
      const me=await meR.json().catch(()=>({}));
      if(!meR.ok||!me.user||me.user.role!=='admin'){location.href='/';return;}
      const r=await fetch('/api/admin/problem-bank/'+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store'});
      const p=await r.json().catch(()=>({}));
      if(!r.ok)throw Error(p.error||('HTTP '+r.status));
      render(p);
    }catch(e){
      $('#title').textContent='문제은행 진행상황';
      $('#sub').textContent='조회 실패';
      $('#content').innerHTML='<div class="error">'+esc(e.message||e)+'</div>';
    }
  }
  function render(p){
    $('#title').textContent=(p.name||'학생')+' · '+(p.username||'')+' · 문제은행 진행상황';
    const schools=Array.isArray(p.schools)?p.schools.filter(Boolean):[];
    const status=p.status&&typeof p.status==='object'?p.status:{};
    const photos=Array.isArray(p.photos)?p.photos:[];
    const keys=Object.keys(status);
    $('#sub').textContent=schools.length?'선택 학교 '+schools.length+'개'+(p.updated_at?' · 마지막 저장 '+new Date(p.updated_at).toLocaleString('ko-KR'):''):'저장된 문제은행 진행상황';
    if(!schools.length&&!keys.length&&!photos.length){$('#content').innerHTML='<div class="muted">아직 선택하거나 진행한 문제가 없습니다.</div>';return;}
    let html='<div class="summary"><span class="pill">선택 학교 '+schools.length+'개</span><span class="pill">진행 기록 '+keys.length+'개</span><span class="pill">등록 사진 '+photos.length+'장</span></div>';
    schools.forEach(s=>{
      const entries=keys.filter(k=>k.indexOf(s+'::')===0);
      html+='<div class="school"><div class="school-title">🏫 '+esc(s)+'</div>';
      if(!entries.length)html+='<div class="muted">아직 진행 기록이 없습니다.</div>';
      else html+='<div class="prompts">'+entries.map(k=>{const v=status[k]||'미진행';return '<div class="prompt '+cls(v)+'"><span>'+esc(k.slice(s.length+2))+'</span><b>'+esc(v)+'</b></div>';}).join('')+'</div>';
      html+='</div>';
    });
    const unknown=keys.filter(k=>!schools.some(s=>k.indexOf(s+'::')===0));
    if(unknown.length)html+='<div class="school"><div class="school-title">저장된 기타 진행 기록</div><div class="prompts">'+unknown.map(k=>{const v=status[k]||'미진행';return '<div class="prompt '+cls(v)+'"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>';}).join('')+'</div></div>';
    html+='<section class="pb-admin-photos"><div class="pb-admin-photos-title">📷 학생 등록 사진 ('+photos.length+')</div>'+photoHtml(photos)+'</section>';
    $('#content').innerHTML=html;
  }
  load();
})();
</script>
</body>
</html>
