<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREENSUM 관리자 로그인</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif;color:#26313b;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(430px,100%);background:#fff;border:1px solid #dce2e8;border-radius:20px;padding:28px;box-shadow:0 15px 45px #26313b12}.brand{font-size:22px;font-weight:900;margin-bottom:28px}.brand b{color:#c72525}.sub{color:#7b8794;margin:-15px 0 24px}label{display:block;font-weight:800;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d6dde5;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#283a4d;color:#fff;font-weight:900;font-size:16px}a{display:block;text-align:center;margin-top:14px;color:#536273;text-decoration:none;font-weight:700}#msg{margin-top:14px;color:#c72525;font-weight:700;min-height:20px}</style></head><body><main class="box"><div class="brand"><b>G</b> GREENSUM 관리자</div><p class="sub">관리자 계정으로 로그인해주세요.</p><form id="f"><label>관리자 아이디</label><input id="username" autocomplete="username" required><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button>관리자 로그인</button><div id="msg"></div></form><a href="/admin-signup.html">처음 사용하시나요? · 관리자 회원가입</a></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='로그인 중...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'로그인에 실패했습니다.');if(j.user?.role!=='admin'){await fetch('/api/logout',{method:'POST'});throw new Error('관리자 계정이 아닙니다.');}location.href='/admin.html'}catch(err){msg.textContent=err.message}});</script></body></html>
