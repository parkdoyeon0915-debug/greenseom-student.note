<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그린섬 · 문제은행</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#26313b;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif}
.top{height:68px;background:#fff;border-bottom:1px solid #dce2e8;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-weight:900}.brand b{color:#c72525}.back{border:1px solid #d6dde5;background:#fff;padding:9px 13px;border-radius:10px;font-weight:800}
.wrap{max-width:1180px;margin:auto;padding:24px 20px 50px}.hero,.box,.school{background:#fff;border:1px solid #dce2e8;border-radius:18px}.hero{padding:24px;margin-bottom:16px}.hero h1{margin:5px 0 8px;font-size:29px}.eyebrow,.muted{color:#7d8791;font-size:13px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.04em}.box,.school{padding:18px;margin-bottom:16px}.selects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.select{width:100%;padding:12px;border:1px solid #d8dee5;border-radius:11px;background:#fff;font:inherit}.hint{font-size:12px;color:#8a939c;margin:8px 0 0}.schoolhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.scroll{overflow:auto;margin-top:13px;border:1px solid #dce2e8;border-radius:13px}.table{border-collapse:collapse;width:100%;min-width:max-content}.table th,.table td{border-bottom:1px solid #e4e8ec;border-right:1px solid #e4e8ec;padding:10px 8px;text-align:center;vertical-align:middle}.table th{background:#f6f8fa;font-size:12px;line-height:1.35;min-width:150px}.table th:first-child,.table td:first-child{position:sticky;left:0;background:#f6f8fa;z-index:2;min-width:94px;font-weight:900}.status{width:126px;padding:9px 6px;border:1px solid #d8dee5;border-radius:9px;background:#fff;font:inherit;font-weight:800}.s-rough,.s-detail{background:#f1f5ff;border-color:#cbd7f4}.s-color{background:#fff6e6;border-color:#f2d29b}.s-done{background:#e9f7ef;border-color:#b8e2c8}.s-edit{background:#fff0f0;border-color:#f0bcbc}
@media(max-width:700px){.top{padding:0 12px}.wrap{padding:14px 10px 40px}.hero h1{font-size:25px}.selects{grid-template-columns:1fr}.table th{min-width:135px}.status{width:118px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>G</b> 그린섬 학생 페이지 · 문제은행</div><button class="back" onclick="location.href='/'">← 학생페이지</button></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">PROBLEM BANK</div><h1>📚 문제은행</h1><p class="muted">실제 저장소에 등록된 학교와 제시물만 사용합니다.</p></section>
<section class="box"><h2>문제은행 학교 선택</h2><p class="muted">최대 3개 학교까지 선택할 수 있어요. 학교를 선택하면 해당 학교의 실제 제시물이 아래에 표시됩니다.</p><div class="selects" id="selects"></div></section>
<div id="schools"></div>
</main>
<script>
const S={
"강원(삼척)":['텀블러&도시락','물안경&스노우보드','스마트워치&이어폰'],
"남서울":['트리방울&스프링','볼트너트&깃털','머그컵&책','와인잔&수건','무당벌레&테니스공'],
"백석":['단추&국자','다트&손거울','주사위&볼링핀','줄자&와인잔','트라이앵글&병뚜껑'],
"상명(천안)":['테니스채&셔틀콕&스펀지','콘센트&돋보기&만년필','다트&탁구채+공&비커','쪼리신발&전구&나무기차','페인트롤러&나무톱&귤','안경&메모지+압정&호두','발레슈즈&톱니&아이스크림','해바라기&달걀껍질&앵무새','벼&동전&선인장','나사못&조개껍질&도토리','파&노트+펜&옥수수알맹이','리본&색종이+클립&아이스크림','식물줄기&라임&벽돌','옷핀&종이&풍선','파티장식 리본&나뭇잎&압정','줄자&연필&금붕어','모종삽&핑킹가위&양배추','와인따개+코르크&콘센트&수박','전화선&공책&브로콜리','판사봉&체리&물이 든 유리컵'],
"청주":['토마토&전기콘센트','스테이플러&실타래','선물상자&커터칼','벽돌&허리벨트','콜라&칫솔','금붕어&물안경','셔틀콕&줄자','목장갑&애견리드줄'],
"한양(에리카)":['가위&팽이','꼬리빗&오레오쿠키','나사못&종이컵','넥타이&합죽선','스페너&빨래집게','스프링&무선마우스','십자드라이버&무지편지봉투','주름스트로우&티백','철제옷걸이&탁구채','케이블타이&밥주걱','병따개&육각너트','손거울&자물쇠','에어캡&모종삽','달걀박스&병따개','연필깎이&주름스트로우'],
"호서":['사과&자물쇠','종이비행기&스카치테이프','테니스공&만년필','라임&분무기','자물쇠&전선']};
const states=['미진행','러프스케치','디테일스케치','채색중','완료','수정필요'];
let selected=['','',''];
const key='greensum_problem_bank_schools';
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{selected=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(selected)||selected.length!==3)selected=['','','']}catch(e){selected=['','','']}}
function save(){localStorage.setItem(key,JSON.stringify(selected))}
function cls(v){return v==='완료'?'s-done':v==='수정필요'?'s-edit':v==='채색중'?'s-color':v==='러프스케치'?'s-rough':v==='디테일스케치'?'s-detail':''}
function render(){const box=document.querySelector('#selects');box.innerHTML='';for(let i=0;i<3;i++){let h='<div class="field"><label>문제은행 학교 선택 '+(i+1)+'</label><select class="select" data-slot="'+i+'"><option value="">학교를 선택해주세요</option>';Object.keys(S).forEach(s=>h+='<option value="'+esc(s)+'" '+(selected[i]===s?'selected':'')+'>'+esc(s)+'</option>');h+='</select></div>';box.insertAdjacentHTML('beforeend',h)}box.querySelectorAll('select').forEach(el=>el.onchange=()=>{selected[+el.dataset.slot]=el.value;save();renderSchools()});renderSchools()}
function renderSchools(){const box=document.querySelector('#schools');box.innerHTML='';selected.filter(Boolean).forEach(s=>{let h='<section class="school"><div class="schoolhead"><h2>🏫 '+esc(s)+'</h2><span class="muted">'+S[s].length+'개 제시물</span></div><div class="scroll"><table class="table"><thead><tr><th>진행상황</th>';S[s].forEach(p=>h+='<th>'+esc(p)+'</th>');h+='</tr></thead><tbody><tr><td>진행상황</td>';S[s].forEach(p=>{h+='<td><select class="status" data-school="'+esc(s)+'" data-prompt="'+esc(p)+'"><option>미진행</option>'+states.slice(1).map(x=>'<option>'+x+'</option>').join('')+'</select></td>'});h+='</tr></tbody></table></div><p class="hint">↔ 표를 좌우로 밀어서 모든 제시물을 확인할 수 있어요.</p></section>';box.insertAdjacentHTML('beforeend',h)});box.querySelectorAll('.status').forEach(el=>el.onchange=()=>{localStorage.setItem('greensum_problem_bank_status_'+el.dataset.school+'::'+el.dataset.prompt,el.value);el.className='status '+cls(el.value)})}
load();render();
</script>
</body>
</html>
