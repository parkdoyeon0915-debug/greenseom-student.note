<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그린섬 · 문제은행</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#26313b;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif}
.top{height:68px;background:#fff;border-bottom:1px solid #dce2e8;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}
.brand{font-weight:900}.brand b{color:#c72525}
.back{border:1px solid #d6dde5;background:#fff;padding:9px 13px;border-radius:10px;font-weight:800}
.wrap{max-width:900px;margin:auto;padding:24px 18px 50px}
.hero,.box{background:#fff;border:1px solid #dce2e8;border-radius:18px}
.hero{padding:24px;margin-bottom:16px}.eyebrow{font-size:12px;color:#7d8791;font-weight:800;letter-spacing:.04em}.hero h1{margin:6px 0 8px;font-size:28px}.muted{color:#7d8791;font-size:13px}
.box{padding:20px}.box h2{margin:0 0 6px}.selects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.select{width:100%;padding:14px 12px;border:1px solid #d8dee5;border-radius:11px;background:#fff;font:inherit;font-weight:700}
.next{margin-top:18px;padding:14px;border-radius:12px;background:#f6f8fa;color:#7d8791;font-size:13px}.next.ready{background:#edf3f9;color:#26313b;font-weight:800}
@media(max-width:700px){.top{padding:0 12px}.wrap{padding:14px 10px 40px}.hero h1{font-size:25px}.selects{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>G</b> 그린섬 학생 페이지 · 문제은행</div><button class="back" onclick="location.href='/'">← 학생페이지</button></header>
<main class="wrap">
<section class="hero">
<div class="eyebrow">PROBLEM BANK</div>
<h1>📚 문제은행 진행상황</h1>
<p class="muted">먼저 지원하는 학교를 선택해주세요.</p>
</section>
<section class="box">
<h2>지원 학교 선택</h2>
<p class="muted">문제은행을 준비할 학교를 최대 3곳까지 선택할 수 있어요.</p>
<div class="selects">
<div class="field"><label>문제은행 학교 선택 1</label><select id="school1" class="select"><option value="">학교를 선택해주세요</option></select></div>
<div class="field"><label>문제은행 학교 선택 2</label><select id="school2" class="select"><option value="">학교를 선택해주세요</option></select></div>
<div class="field"><label>문제은행 학교 선택 3</label><select id="school3" class="select"><option value="">학교를 선택해주세요</option></select></div>
</div>
<div id="next" class="next">학교를 선택하면 다음 단계가 준비됩니다.</div>
</section>
</main>
<script>
const schools=['강원(삼척)','남서울','백석','상명(천안)','청주','한양(에리카)','호서'];
const selects=[document.getElementById('school1'),document.getElementById('school2'),document.getElementById('school3')];
const next=document.getElementById('next');
function fill(){selects.forEach(s=>schools.forEach(x=>s.insertAdjacentHTML('beforeend','<option value="'+x+'">'+x+'</option>')))}
function update(){const picked=selects.map(s=>s.value).filter(Boolean);next.classList.toggle('ready',picked.length>0);next.textContent=picked.length?'선택한 학교: '+picked.join(' · '):'학교를 선택하면 다음 단계가 준비됩니다.';localStorage.setItem('greensum_problem_bank_schools',JSON.stringify(selects.map(s=>s.value)))}
function load(){try{const saved=JSON.parse(localStorage.getItem('greensum_problem_bank_schools')||'[]');selects.forEach((s,i)=>{if(saved[i])s.value=saved[i]})}catch(e){}update()}
selects.forEach(s=>s.addEventListener('change',update));
fill();load();
</script>
</body>
</html>
