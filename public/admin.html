<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREENSUM 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif;color:#26313b}.bar{height:65px;background:#fff;border-bottom:1px solid #dce2e8;display:flex;justify-content:space-between;align-items:center;padding:0 22px;position:sticky;top:0;z-index:20}.brand{font-weight:900}.brand b{color:#c72525}.wrap{max-width:1180px;margin:auto;padding:24px}.card,.hero,.section{background:#fff;border:1px solid #dce2e8;border-radius:18px;padding:20px;margin-bottom:18px}.student{padding:15px;border-top:1px solid #e5e9ed;display:flex;justify-content:space-between;align-items:center;gap:12px}.student:hover{background:#f7f9fb}.btn{border:1px solid #d6dde5;background:#fff;padding:9px 12px;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:#283a4d;color:#fff}.danger{color:#b42318;border-color:#f0b4ae}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.record{border:1px solid #e1e6eb;border-radius:12px;padding:12px;cursor:pointer;background:#fff}.thumb{height:150px;background:#f2f4f6;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:contain}.muted{color:#7d8791;font-size:13px}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.diaggrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.photo{min-height:360px;border:2px dashed #cbd3dc;border-radius:15px;background:#fafbfc;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{max-width:100%;max-height:500px;object-fit:contain}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metaBox{border:1px solid #e1e6eb;border-radius:10px;padding:12px}.metaBox b{display:block;font-size:12px;margin-bottom:5px}.scores{border:1px solid #dce2e8;border-radius:12px;overflow:hidden;margin-top:14px}.scoreh,.scorer{display:grid;grid-template-columns:1fr repeat(5,55px)}.scoreh{background:#f6f8fa;font-size:10px}.scoreh div,.scorer>div{text-align:center;padding:9px 3px}.scoreh div:first-child,.scorer .label{text-align:left;padding-left:10px}.scorer{border-top:1px solid #e4e8ec}.scorer .label{font-weight:800;font-size:12px}.total{display:flex;justify-content:space-between;padding:14px;background:#edf3f9;border-radius:12px;margin-top:12px}.total b{font-size:22px}.textBox{border:1px solid #e1e6eb;border-radius:12px;padding:14px;margin-top:12px}.textBox h4{margin:0 0 8px}.text{white-space:pre-wrap;line-height:1.6}.teacher{border:2px solid #283a4d;border-radius:12px;padding:14px;margin-top:12px;background:#fafbfc}.teacher textarea{width:100%;min-height:100px;border:1px solid #d6dde5;border-radius:10px;padding:12px;font:inherit;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.pattern{border:1px solid #e1e6eb;border-radius:14px;padding:15px;margin-bottom:12px}.patternHero{height:260px;background:#f3f5f7;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.patternHero img{max-width:100%;max-height:100%;object-fit:contain}.patternImgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.patternImgs img{width:100%;height:150px;object-fit:contain;background:#f3f5f7;border-radius:8px}.teacher-row{padding:15px;border-top:1px solid #e5e9ed;display:flex;justify-content:space-between;align-items:center;gap:12px}.teacher-row:first-child{border-top:0}.teacher-actions{display:flex;gap:8px;flex-wrap:wrap}.profile-box{border:1px solid #e1e6eb;border-radius:12px;padding:15px;margin-top:12px;background:#fafbfc}.super-badge{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#edf3f9;color:#536273;font-size:12px;font-weight:800}@media(max-width:800px){.diaggrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.patternImgs{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.scoreh,.scorer{grid-template-columns:1fr repeat(5,39px)}.bar{padding:0 12px}.teacher-row{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="bar"><div class="brand"><b>G</b> GREENSUM 관리자</div><button class="btn" onclick="logout()">로그아웃</button></header><main class="wrap"><div class="card"><h1>학생 관리</h1><p class="muted">학생별 기록을 학생 페이지와 같은 형태로 확인합니다.</p><div id="students">불러오는 중...</div></div><div id="superAdminSection" class="card" style="display:none"><div class="detail-head"><div><h2 style="margin:0">👑 선생님 계정 관리</h2><p class="muted">최고관리자 전용 · 다른 선생님의 관리자 프로필을 확인하고 계정을 탈퇴시킬 수 있습니다.</p></div><span class="super-badge">doyean7 최고관리자</span></div><div id="teachers">불러오는 중...</div></div><div id="detail" class="card"><div class="muted">학생을 선택해주세요.</div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}
async function kickStudent(id,name){if(!confirm(name+' 학생을 강퇴할까요?\n\n강퇴하면 해당 계정의 로그인이 차단됩니다. 기존 기록은 보존됩니다.'))return;const r=await fetch('/api/admin/students/'+id,{method:'DELETE'});const j=await r.json().catch(()=>({}));if(!r.ok)return alert(j.error||'강퇴에 실패했습니다.');document.querySelector('#detail').innerHTML='<div class="muted">학생을 선택해주세요.</div>';await init();alert(name+' 학생을 강퇴했습니다.')}
function scoreRows(r){const vals=[r.problem_analysis,r.form_score,r.completion,r.expression,r.composition];const names=['문제 분석','형태','완성도','표현','구성'];return names.map((n,i)=>'<div class="scorer"><div class="label">'+n+'</div>'+[1,2,3,4,5].map(v=>'<div>'+(+vals[i]===v?'●':'○')+'</div>').join('')+'</div>').join('')}
function diagView(r){return '<section class="section"><div class="detail-head"><div><h2 style="margin:0">🎨 그림 자가진단</h2><p class="muted">'+esc(r.date)+' · '+esc(r.subject||'소재 미입력')+'</p></div><strong>'+r.total+'/25</strong></div><div class="diaggrid"><div class="photo">'+(r.photo?'<img src="'+r.photo+'">':'<span class="muted">등록된 그림이 없습니다.</span>')+'</div><div><div class="scores"><div class="scoreh"><div>항목</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>'+scoreRows(r)+'</div><div class="total"><span>총점</span><b>'+r.total+' / 25</b></div><div class="textBox"><h4>학생이 기록한 내용</h4><div class="text">'+esc(r.notes||'기록 없음')+'</div></div><div class="textBox"><h4>앞으로 개선할 점</h4><div class="text">'+esc(r.improve||'기록 없음')+'</div></div></div></div><div class="teacher"><h4 style="margin:0 0 8px">도연&인혜T의 한마디 <span class="muted">· 관리자 전용</span></h4><textarea id="teacher_'+r.id+'">'+esc(r.teacher_note||'')+'</textarea><div class="actions"><button class="btn primary" onclick="saveTeacher('+r.id+')">저장</button></div></div></section>'}
function patternView(r){return '<section class="section"><h2 style="margin-top:0">🧵 패턴 연구노트</h2><div class="pattern"><h3>'+esc(r.name)+'</h3><div class="patternHero">'+(r.photo?'<img src="'+r.photo+'">':'<span class="muted">대표 사진 없음</span>')+'</div><div class="textBox"><h4>꼭 가져갈 점</h4><div class="text">'+esc(r.must_keep||'기록 없음')+'</div></div><div class="textBox"><h4>주의할 점</h4><div class="text">'+esc(r.cautions||'기록 없음')+'</div></div><div class="textBox"><h4>학생의 피드백</h4><div class="text">'+esc(r.self_feedback||'기록 없음')+'</div></div>'+(r.images?.length?'<h4 style="margin-bottom:8px">패턴을 적용한 그림</h4><div class="patternImgs">'+r.images.map(x=>'<img src="'+x.photo+'">').join('')+'</div>':'')+'</div></section>'}
async function saveTeacher(id){const note=document.getElementById('teacher_'+id).value;const r=await fetch('/api/admin/diagnoses/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher_note:note})});const j=await r.json().catch(()=>({}));if(!r.ok)return alert(j.error||'저장에 실패했습니다.');alert('도연&인혜T의 한마디가 저장되었습니다.')}
async function show(id){const x=await(await fetch('/api/admin/students/'+id)).json();if(x.error)return alert(x.error);document.querySelector('#detail').innerHTML='<div class="detail-head"><div><h2 style="margin:0">'+esc(x.student.name)+' 학생</h2><p class="muted">학생 페이지에서 보이는 기록을 관리자 화면에서도 그대로 확인합니다.</p></div><button class="btn" onclick="document.querySelector(\'#detail\').scrollIntoView({behavior:\'smooth\'})">기록 보기</button></div>'+(x.diagnoses?.length?x.diagnoses.map(diagView).join(''):'<section class="section"><div class="muted">그림 자가진단 기록이 없습니다.</div></section>')+(x.patterns?.length?x.patterns.map(patternView).join(''):'<section class="section"><div class="muted">패턴 연구노트가 없습니다.</div></section>');document.querySelector('#detail').scrollIntoView({behavior:'smooth',block:'start'})}
async function viewTeacher(id){const row=document.getElementById('teacher_profile_'+id);if(!row)return;document.querySelectorAll('.profile-box').forEach(x=>x.remove());row.insertAdjacentHTML('afterend','<div class="profile-box"><b>프로필</b><div style="margin-top:8px">이름 · '+esc(row.dataset.name)+'</div><div>아이디 · '+esc(row.dataset.username)+'</div><div>권한 · 관리자</div><div>가입일 · '+esc(row.dataset.created)+'</div></div>')}
async function removeTeacher(id,name){if(!confirm(name+' 선생님 계정을 탈퇴시킬까요?\n\n탈퇴하면 해당 관리자 계정으로 더 이상 로그인할 수 없습니다.'))return;const r=await fetch('/api/superadmin/teachers/'+id,{method:'DELETE'});const j=await r.json().catch(()=>({}));if(!r.ok)return alert(j.error||'선생님 계정 탈퇴에 실패했습니다.');alert(name+' 선생님 계정을 탈퇴 처리했습니다.');await loadTeachers()}
async function loadTeachers(){try{const r=await fetch('/api/superadmin/teachers');if(r.status===403){document.getElementById('superAdminSection').style.display='none';return}const a=await r.json();document.getElementById('superAdminSection').style.display='block';document.getElementById('teachers').innerHTML=a.length?a.map(t=>'<div class="teacher-row" id="teacher_profile_'+t.id+'" data-name="'+esc(t.name)+'" data-username="'+esc(t.username)+'" data-created="'+esc(new Date(t.created_at).toLocaleDateString('ko-KR'))+'"><div><b>'+esc(t.name)+'</b><br><small>'+esc(t.username)+'</small></div><div class="teacher-actions"><button class="btn" onclick="viewTeacher('+t.id+')">프로필 보기</button><button class="btn danger" onclick="removeTeacher('+t.id+','+JSON.stringify(t.name)+')">탈퇴</button></div></div>').join(''):'등록된 다른 선생님이 없습니다.'}catch(e){document.getElementById('superAdminSection').style.display='none'}}
async function init(){const m=await(await fetch('/api/me')).json();if(!m.user||m.user.role!=='admin')return location.href='/';const a=await(await fetch('/api/admin/students')).json();document.querySelector('#students').innerHTML=a.map(s=>'<div class="student"><div onclick="show('+s.id+')" style="flex:1;cursor:pointer"><b>'+esc(s.name)+'</b> · '+esc(s.username)+'<br><small>자가진단 '+s.diagnoses+'개 · 패턴 '+s.patterns+'개 · 최근 '+esc(s.last_date||'-')+'</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="show('+s.id+')">기록 보기</button><button class="btn danger" onclick="kickStudent('+s.id+','+JSON.stringify(s.name)+')">강퇴</button></div></div>').join('')||'학생이 없습니다.';await loadTeachers()}
init();
</script></body></html>
