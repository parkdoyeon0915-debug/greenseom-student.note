services:
  - type: web
    name: greensum-note
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greensum-db
          property: connectionString
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: greensum-db
    plan: free
    region: singapore
    databaseName: greensum
    user: greensum
