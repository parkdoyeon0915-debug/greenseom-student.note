<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREENSUM 관리자 회원가입</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif;color:#26313b;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(430px,100%);background:#fff;border:1px solid #dce2e8;border-radius:20px;padding:28px;box-shadow:0 15px 45px #26313b12}.brand{font-size:22px;font-weight:900;margin-bottom:12px}.brand b{color:#c72525}.sub{color:#7b8794;margin:0 0 24px;line-height:1.5}label{display:block;font-weight:800;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d6dde5;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#283a4d;color:#fff;font-weight:900;font-size:16px}a{display:block;text-align:center;margin-top:14px;color:#536273;text-decoration:none;font-weight:700}#msg{margin-top:14px;color:#c72525;font-weight:700;min-height:20px}</style></head><body><main class="box"><div class="brand"><b>G</b> GREENSUM 관리자</div><p class="sub">선생님별 관리자 계정을 만들어주세요.<br>관리자 가입코드를 입력해야 합니다.</p><form id="adminSignupForm"><label>선생님 이름</label><input id="adminName" autocomplete="name" required><label>관리자 아이디</label><input id="adminUsername" autocomplete="username" required><label>비밀번호</label><input id="adminPassword" type="password" autocomplete="new-password" minlength="6" required><label>비밀번호 확인</label><input id="adminPassword2" type="password" autocomplete="new-password" minlength="6" required><label>관리자 가입코드</label><input id="adminCode" type="password" autocomplete="off" required><button type="submit">관리자 계정 만들기</button><div id="adminSignupMsg"></div></form><a href="/admin-login.html">이미 계정이 있어요 · 관리자 로그인</a></main><script>document.getElementById('adminSignupForm').addEventListener('submit',async function(e){e.preventDefault();const msg=document.getElementById('adminSignupMsg');const name=document.getElementById('adminName').value.trim();const username=document.getElementById('adminUsername').value.trim();const password=document.getElementById('adminPassword').value;const password2=document.getElementById('adminPassword2').value;const code=document.getElementById('adminCode').value;msg.textContent='계정 생성 중...';if(!name||!username||!password||!password2||!code){msg.textContent='이름, 아이디, 비밀번호, 가입코드를 모두 입력해주세요.';return}if(password!==password2){msg.textContent='비밀번호가 서로 다릅니다.';return}try{const r=await fetch('/api/admin/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,username,password,code})});const j=await r.json();if(!r.ok)throw new Error(j.error||'관리자 계정 생성에 실패했습니다.');alert('관리자 계정이 생성되었습니다.\n관리자 로그인 페이지에서 로그인해주세요.');location.href='/admin-login.html'}catch(err){msg.textContent=err.message}});</script></body></html>
