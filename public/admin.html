<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREENSUM 관리자</title>
<style>body{margin:0;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif;color:#26313b}.bar{height:65px;background:white;border-bottom:1px solid #dce2e8;display:flex;justify-content:space-between;align-items:center;padding:0 22px}.brand{font-weight:900}.brand b{color:#c72525}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dce2e8;border-radius:18px;padding:20px;margin-bottom:18px}.student{padding:15px;border-top:1px solid #e5e9ed;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.student:hover{background:#f7f9fb}.btn{border:1px solid #d6dde5;background:#fff;padding:9px 12px;border-radius:9px;font-weight:800}.primary{background:#283a4d;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #e1e6eb;border-radius:12px;padding:12px}.thumb{height:150px;background:#f2f4f6;border-radius:9px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><header class="bar"><div class="brand"><b>G</b> GREENSUM 관리자</div><button class="btn" onclick="logout()">로그아웃</button></header><main class="wrap"><div class="card"><h1>학생 관리</h1><p>학생별 그림 자가진단과 패턴 연구노트를 확인합니다.</p><div id="students">불러오는 중...</div></div><div class="card"><h2 id="title">학생을 선택해주세요.</h2><div id="detail"></div></div></main><script>
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}
async function kickStudent(id,name){if(!confirm(name+' 학생을 강퇴할까요?\n\n강퇴하면 해당 계정의 로그인이 차단됩니다. 기존 기록은 보존됩니다.'))return;const r=await fetch('/api/admin/students/'+id,{method:'DELETE'});const j=await r.json().catch(()=>({}));if(!r.ok)return alert(j.error||'강퇴에 실패했습니다.');document.querySelector('#title').textContent='학생을 선택해주세요.';document.querySelector('#detail').innerHTML='';await init();alert(name+' 학생을 강퇴했습니다.')}
async function init(){let m=await(await fetch('/api/me')).json();if(!m.user||m.user.role!=='admin')return location.href='/';let a=await(await fetch('/api/admin/students')).json();document.querySelector('#students').innerHTML=a.map(s=>`<div class="student" onclick="show(${s.id})"><div><b>${s.name}</b> · ${s.username}<br><small>자가진단 ${s.diagnoses}개 · 패턴 ${s.patterns}개 · 최근 ${s.last_date||'-'}</small></div><div style="display:flex;gap:8px"><button class="btn" onclick="event.stopPropagation();show(${s.id})">기록 보기</button><button class="btn" style="color:#b42318;border-color:#f0b4ae" onclick="event.stopPropagation();kickStudent(${s.id},${JSON.stringify(s.name)})">강퇴</button></div></div>`).join('')||'학생이 없습니다.'}
async function show(id){let x=await(await fetch('/api/admin/students/'+id)).json();document.querySelector('#title').textContent=x.student.name+' 학생의 기록';let d=x.diagnoses.map(r=>`<div class="item"><div class="thumb">${r.photo?`<img src="${r.photo}">`:'사진 없음'}</div><b>${r.date}</b><p>${r.subject||''} · <strong>${r.total}/25</strong></p><small>${r.notes||''}</small><br><small>개선: ${r.improve||'-'}</small></div>`).join('');let p=x.patterns.map(r=>`<div class="item"><div class="thumb">${r.photo?`<img src="${r.photo}">`:'사진 없음'}</div><b>${r.name}</b><p>적용 그림 ${r.images.length}장</p><small>${r.must_keep||''}</small></div>`).join('');document.querySelector('#detail').innerHTML=`<h3>🎨 그림 자가진단</h3><div class="grid">${d||'기록 없음'}</div><h3>🧵 패턴 연구노트</h3><div class="grid">${p||'기록 없음'}</div>`}
init()
</script></body></html>
