name: Fix photo upload handling

on:
  push:
    paths:
      - '.github/workflows/fix-photo-upload.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch photo preview without losing file input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old="function filePreview(input,box,placeholder){input.onchange=()=>{const f=input.files[0];if(!f)return;const u=URL.createObjectURL(f);box.innerHTML='<img src=\\\"'+u+'\\\">'}}"
          new="function filePreview(input,box,placeholder){input.onchange=()=>{const f=input.files[0];if(!f)return;const u=URL.createObjectURL(f);const img=document.createElement('img');img.src=u;img.alt='선택한 사진';img.style.maxWidth='100%';img.style.maxHeight='100%';img.style.objectFit='contain';box.innerHTML='';box.appendChild(input);box.appendChild(img)}}"
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Fix photo upload input handling' || true
          rm -f .github/workflows/fix-photo-upload.yml
          git add -A
          git commit -m 'Remove temporary photo fix workflow' || true
          git push