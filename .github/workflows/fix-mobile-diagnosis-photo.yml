name: Fix mobile diagnosis photo selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-photo-picker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile photo preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          pattern = r"function bindPhoto\(id,boxId,type\)\{.*?\nfunction newDiag\(\)"
          replacement = '''function bindPhoto(id,boxId,type){
const input=$(id),box=$(boxId);if(!input||!box)return;
const handle=()=>{
  const f=input.files&&input.files[0];
  if(!f)return;
  if(!f.type||!f.type.startsWith('image/')){alert('이미지 파일만 선택할 수 있습니다.');input.value='';return}
  if(type==='diag')diagSelectedFile=f;else patSelectedFile=f;
  let img=box.querySelector('.preview-photo');
  if(!img){img=document.createElement('img');img.className='preview-photo';img.alt='선택한 사진';img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;background:#fafbfc;';box.appendChild(img)}
  const ph=box.querySelector('.photo-placeholder,.pattern-placeholder');if(ph)ph.style.display='none';
  try{
    const url=URL.createObjectURL(f);img.src=url;img.onload=()=>URL.revokeObjectURL(url);
  }catch(e){
    const reader=new FileReader();reader.onload=e=>{img.src=e.target.result};reader.readAsDataURL(f);
  }
};
input.addEventListener('change',handle);input.addEventListener('input',handle)}
function newDiag()'''

          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('bindPhoto function was not found; no change made')
          p.write_text(ns, encoding='utf-8')
          print('patched public/index.html')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-mobile-diagnosis-photo.yml
          git add public/index.html .github/workflows/fix-mobile-diagnosis-photo.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: make mobile diagnosis photo preview reliable"
          git push
